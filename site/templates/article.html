<main id="main" class="container article-main">
  <a class="back-link" href="./#journal">← 개발 기록 목록</a>
  <header class="article-header">
    <p class="eyebrow">DEVELOPMENT JOURNAL / $post_number</p>
    <h1>$article_title</h1>
    <p class="article-summary">$summary</p>
    <div class="article-meta"><span>$author</span><span>$date</span><span>$category</span></div>
  </header>
  <div class="article-grid">
    <aside class="article-sidebar"><details open><summary>이 글의 순서</summary><nav aria-label="본문 목차">$toc</nav></details><a class="source-link" href="$source_url">GitHub에서 원문 보기 ↗</a></aside>
    <article class="prose" aria-label="$article_title">$article_content</article>
  </div>
  <div class="article-end"><span>다음 기록도 이곳에 이어집니다.</span><a class="button-outline" href="./#journal">개발 기록 모두 보기 →</a></div>
</main>
